server:
  ip: 0.0.0.0
  port: 8000
  auth:
    enabled: false
    tokens:
      - token: "your-token1"
        name: "your-device-name1"
      - token: "your-token2"
        name: "your-device-name2"
    allowed_devices: []

session:
  min_frames: 15
  pre_buffer_frames: 10
  no_voice_close_seconds: 120
  silence_stop_ms: 700
  opus_sample_rate: 16000
  opus_channels: 1
  opus_frame_size: 960
  opus_gain: 1.0
  vad:
    type: energy
    energy_threshold: 0.01

audio_flow:
  enabled: true
  pre_buffer_frames: 3
  frame_duration_ms: 60
  send_rate_multiplier: 1.0
  max_delay_ms: 100

sentence_delay:
  enabled: true
  base_delay_ms: 200
  dynamic: true
  length_threshold: 30
  long_sentence_extra_ms: 300

asr:
  type: file_stub
  output_dir: tmp
  delete_audio: true
  sample_rate: 16000
  channels: 1
  stub_transcript: "收到语音"

llm:
  type: echo
  echo:
    welcome_message: "你好，我是小智。"
    echo_transcripts: true

memory:
  type: none
  path: data/.memory.yaml
  max_len: 4000

intent:
  exit_commands:
    - "退出"
    - "再见"
    - "拜拜"
    - "结束对话"
  wakeup_words:
    - "你好小智"
    - "你好啊小智"
    - "小智你好"
    - "小智"
  enable_greeting: true
  wakeup_response_cache: false
  wakeup_response_cache_dir: config/assets
  wakeup_response_cache_min_size: 15360
  functions:
    - play_music
    - get_news

private_config:
  enabled: false
  path: data/.private_config.yaml

plugins:
  get_weather:
    api_key: "your_amap_api_key_here"
    default_location: "广州"
    base_url: "https://restapi.amap.com"
  baidu_search:
    enabled: false
    search_url: "https://www.baidu.com/s"
    max_results: 10
    max_extract_pages: 3
    max_content_length: 1000
  home_assistant:
    devices: []
    base_url: "http://homeassistant.local:8123"
    api_key: "your_home_assistant_token"
  get_news:
    default_rss_url: "https://www.chinanews.com.cn/rss/society.xml"
    category_urls:
      society: "https://www.chinanews.com.cn/rss/society.xml"
      world: "https://www.chinanews.com.cn/rss/world.xml"
      finance: "https://www.chinanews.com.cn/rss/finance.xml"
  play_music:
    music_dir: ./music
    music_ext:
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 300

mcp:
  enabled: false
  path: data/.mcp_server_settings.json
  servers: {}

tts:
  type: stub
  stop_notify:
    enabled: false
    path: config/assets/tts_notify.mp3
  timeout_seconds: 10
  sample_rate: 16000
  channels: 1
  frame_size: 960
  duration_ms: 180
  frequency: 440
  amplitude: 1200

audio:
  input_format: "wav"
  output_format: "mp3"
  sample_rate: 24000
  channels: 1
  max_duration: 80 #60
  up_gain: 3
  down_gain: 3 #8

xiaozhi:
  version: 1
  format: "opus"
  transport: "websocket"
  sample_rate: 16000
  channels: 1
  frame_duration: 60

local:
  prompt: |
    你是小智，一个运行在本地 Go 服务中的语音助手。
  welcome_message: "你好，我是小智。"
  echo_transcripts: true
  no_voice_prompt: "请你以“时间过得真快”未来头，用富有感情、依依不舍的话来结束这场对话吧。"
